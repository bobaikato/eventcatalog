name: Ota Pressure

on:
  push:
    branches:
      - bobai/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-artifact-lineage:
    name: Generated artifact lineage (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.x
          cache: pnpm

      - uses: ota-run/setup@85bf49c11a5aa3ddedfa56c47682cfd40b238f1f
        with:
          source: contract
          contract-path: ota.yaml

      - name: Validate contract
        run: ota validate . --json

      - name: Diagnose readiness
        run: ota doctor --json

      - name: List runnable tasks
        run: ota tasks --use --json

      - name: List agent-safe tasks
        run: ota tasks --safe --use --json

      - name: Preview generated-source consumer closure
        run: ota run vscode-extension:build --dry-run --json

      - name: Preview the named workflow
        run: ota up --workflow verify --dry-run --json

      - name: Build generated-source consumer closure
        run: ota run vscode-extension:build --stream

      - name: Archive selected task receipt
        if: always()
        run: ota receipt --archive --json

      - name: Upload task evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: eventcatalog-task-evidence-${{ matrix.os }}
          path: .ota/receipts
          if-no-files-found: warn

  workflow-runtime-proof:
    name: Workflow runtime proof (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.x
          cache: pnpm

      - uses: ota-run/setup@85bf49c11a5aa3ddedfa56c47682cfd40b238f1f
        with:
          source: contract
          contract-path: ota.yaml

      - name: Prove the selected workflow runtime
        run: ota proof runtime --workflow verify --json

      - name: Archive workflow proof receipt
        if: always()
        run: ota receipt --workflow verify --archive --json

      - name: Upload workflow proof evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: eventcatalog-workflow-proof
          path: .ota/receipts
          if-no-files-found: warn
