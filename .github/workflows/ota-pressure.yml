name: Ota Pressure

on:
  push:
    branches:
      - bobai/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-artifact-lineage:
    name: Generated artifact lineage (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      - uses: ota-run/setup@v1
        with:
          source: contract
          contract-path: ota.yaml

      - name: Validate contract
        run: ota validate .

      - name: Diagnose readiness
        run: ota doctor

      - name: List runnable tasks
        run: ota tasks --use

      - name: List agent-safe tasks
        run: ota tasks --safe --use

      - name: Preview generated-source consumer closure
        run: ota run vscode-extension:build --agent --dry-run

      - name: Build generated-source consumer closure
        run: ota run vscode-extension:build --agent --stream
