name: Ota Pressure

on:
  push:
    branches:
      - bobai/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-artifact-lineage:
    name: Generated artifact lineage (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      - uses: ota-run/setup@493cba84bf7f7c11c9e8e996d832d93a89c62184 # v1.0.8
        with:
          source: contract
          contract-path: ota.yaml

      - name: Validate contract
        run: ota validate .

      - name: Diagnose readiness
        run: ota doctor

      - name: List runnable tasks
        run: ota tasks --use

      - name: List agent-safe tasks
        run: ota tasks --safe --use

      - name: Preview generated-source consumer closure
        run: ota run vscode-extension:build --agent --dry-run

      - name: Build generated-source consumer closure
        run: ota run vscode-extension:build --agent --stream

  promoted-language-server-replay:
    name: Promoted language-server container replay (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      - uses: ota-run/setup@493cba84bf7f7c11c9e8e996d832d93a89c62184 # v1.0.8
        with:
          source: contract
          contract-path: ota.yaml

      - name: Generate the current Langium source lineage
        run: ota run language-server:generate --agent --stream

      - name: Record the Langium generated-source baseline
        run: ota baseline record --artifact language-server-ast --json > "$RUNNER_TEMP/eventcatalog-baseline-record.json"

      - name: Promote the recorded Langium baseline for this pressure run
        shell: bash
        run: |
          set -euo pipefail
          attestation="$(jq -er '.attestation' "$RUNNER_TEMP/eventcatalog-baseline-record.json")"
          ota baseline promote --artifact language-server-ast --attestation "$attestation" --json > "$RUNNER_TEMP/eventcatalog-baseline-promote.json"

      - name: Diagnose promoted replay authority
        run: ota doctor --workflow promoted-language-server --container .

      - name: Preview promoted replay workflow
        run: ota up --workflow promoted-language-server --container --dry-run --json .

      - name: Compile promoted generated source in its read-only container boundary
        run: ota run language-server:check-promoted --container --agent --stream .

      - name: Archive promoted replay receipt
        run: ota receipt --workflow promoted-language-server --container --ephemeral --json --archive .

      - name: Upload replay authority evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eventcatalog-promoted-language-server-replay-evidence
          path: |
            ${{ runner.temp }}/eventcatalog-baseline-record.json
            ${{ runner.temp }}/eventcatalog-baseline-promote.json
            replay/language-server-ast.ota.json
            .ota/replay-baselines/language-server-ast/
            .ota/receipts/
          if-no-files-found: warn

  committed-promoted-language-server-replay:
    name: Committed promoted language-server container replay (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ota-run/setup@493cba84bf7f7c11c9e8e996d832d93a89c62184 # v1.0.8
        with:
          source: contract
          contract-path: ota.yaml

      - name: Diagnose committed promoted replay authority in its container boundary
        run: ota doctor --workflow promoted-language-server --container .

      - name: Preview committed promoted replay container workflow
        run: ota up --workflow promoted-language-server --container --dry-run --json .

      - name: Compile committed promoted generated source in its read-only container boundary
        run: ota run language-server:check-promoted --container --agent --stream .

      - name: Archive committed container replay receipt
        run: ota receipt --workflow promoted-language-server --container --ephemeral --json --archive .

      - name: Upload committed container replay evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eventcatalog-committed-promoted-language-server-container-replay-evidence
          path: |
            replay/language-server-ast.ota.json
            .ota/receipts/
          if-no-files-found: warn
