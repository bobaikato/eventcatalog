version: 1
project:
  name: eventcatalog-language-server-lineage
  description: Narrow Langium generated-source producer and build-consumer pressure slice
  type: library

toolchains:
  node:
    version: ">=20"
    package_managers:
      pnpm: "*"
    fulfillment:
      source: corepack
      mode: run

execution:
  default_context: host
  lifecycle: persistent
  backends:
    container:
      image: node@sha256:a25c9934ff6382cd4f08b6bc26c82bf4ea69b1e6f8dabfb2ead457374127c365
      engines: [docker]
  contexts:
    host:
      backend: native
    promoted-replay:container:
      backend: container
      lifecycle: ephemeral

artifacts:
  language-server-ast:
    kind: generated_source
    producer: language-server:generate
    paths:
      - packages/language-server/src/generated/ast.ts
      - packages/language-server/src/generated/grammar.ts
      - packages/language-server/src/generated/module.ts
      - packages/language-server/syntaxes/ec.tmLanguage.json
    inputs:
      - packages/language-server/src/ec.langium
      - packages/language-server/langium-config.json
    replay:
      authority_manifest: replay/language-server-ast.ota.json
      consumption: read_only

tasks:
  setup:
    description: Hydrate the lockfile-backed workspace dependencies for the language-server slice
    category: setup
    prepare:
      kind: dependency_hydration
      medium: package_dependencies
      source:
        kind: node_package_manager
        cwd: .
        manager: pnpm
        mode: install
        frozen_lockfile: true
        filter: "@eventcatalog/language-server"
    requirements:
      toolchains:
        - node
    effects:
      writes:
        - node_modules
      network: true
      network_kind: dependency_hydration
    safe_for_agent: true
    execution:
      modes:
        container:
          context: promoted-replay:container

  language-server:generate:
    description: Generate the Langium AST, grammar, and module source
    category: setup
    command:
      exe: pnpm
      args:
        - --filter
        - "@eventcatalog/language-server"
        - run
        - generate
    depends_on:
      - setup
    requirements:
      toolchains:
        - node
    effects:
      writes:
        - packages/language-server/src/generated
        - packages/language-server/syntaxes/ec.tmLanguage.json
        - packages/vscode-extension/syntaxes/ec.tmLanguage.json
    safe_for_agent: true

  language-server:build:
    description: Compile the language server against the generated source
    category: build
    command:
      exe: pnpm
      args:
        - --filter
        - "@eventcatalog/language-server"
        - run
        - build
    depends_on:
      - language-server:generate
    requires_artifacts:
      - language-server-ast
    requirements:
      toolchains:
        - node
    effects:
      writes:
        - packages/language-server/dist
    safe_for_agent: true

  language-server:check-promoted:
    description: Compile the promoted Langium output without rerunning generation
    category: build
    command:
      exe: pnpm
      args:
        - --filter
        - "@eventcatalog/language-server"
        - run
        - build
    depends_on:
      - setup
    requires_artifacts:
      - language-server-ast
    requirements:
      toolchains:
        - node
    effects:
      writes:
        - packages/language-server/dist
    safe_for_agent: true
    execution:
      modes:
        container:
          context: promoted-replay:container
    notes: |
      This promoted replay lane deliberately omits `language-server:generate`. Ota verifies the
      explicitly promoted output authority before and after this agent-safe compiler runs.

  sdk:build:
    description: Build the workspace SDK required by downstream language-server consumers
    category: build
    command:
      exe: pnpm
      args:
        - --filter
        - "@eventcatalog/sdk"
        - run
        - build
    depends_on:
      - setup
    requirements:
      toolchains:
        - node
    safe_for_agent: true

  visualiser:build:
    description: Build the workspace visualiser required by the VS Code extension bundle
    category: build
    command:
      exe: pnpm
      args:
        - --filter
        - "@eventcatalog/visualiser"
        - run
        - build
    depends_on:
      - setup
    requirements:
      toolchains:
        - node
    safe_for_agent: true

  vscode-extension:build:
    description: Build the sibling VS Code extension against the generated language-server source
    category: build
    command:
      exe: pnpm
      args:
        - --filter
        - eventcatalog-dsl
        - run
        - build
    depends_on:
      - language-server:generate
      - language-server:build
      - sdk:build
      - visualiser:build
    requires_artifacts:
      - language-server-ast
    requirements:
      toolchains:
        - node
    safe_for_agent: true

workflows:
  default: language-server
  language-server:
    intent: ci_validation
    description: Build the language server against freshly generated Langium source
    run:
      task: language-server:build
  promoted-language-server:
    intent: ci_validation
    description: Compile promoted Langium generated source without regeneration
    run:
      task: language-server:check-promoted
    notes: |
      This lane proves only the selected approved generated-source output. It does not rerun the
      generator, prove the wider VS Code extension build, or claim repository-wide verification.

agent:
  safe_tasks:
    - language-server:build
    - language-server:check-promoted
    - vscode-extension:build
  writable_paths:
    - node_modules
    - packages/language-server/src/generated
    - packages/language-server/syntaxes
    - packages/language-server/dist
    - packages/vscode-extension/syntaxes
  protected_paths:
    - .github/workflows
  bootstrap:
    ota:
      note: Only install ota if it is missing and installation is approved.
      source:
        kind: branch
        branch: 1.6.25-implementation
